/* ---------------------------------------------------------
   SAFE SAVE / LOAD
--------------------------------------------------------- */

const DEFAULT_GAME = {
  player: "",
  level: 1,
  xp: 0,
  streak: 0,
  last: "",
  completed: 0,
  goals: [],
  daily: [],
  bosses: [],

  week: "",

  stats: {
    discipline: 1,
    knowledge: 1,
    skill: 1,
    health: 1,
    creativity: 1,
    career: 1
  }
};

function freshGame() {
  return JSON.parse(JSON.stringify(DEFAULT_GAME));
}

function loadGame() {

  try {

    const saved = localStorage.getItem(SAVE_KEY);

    if (!saved) {
      return freshGame();
    }

    const parsed = JSON.parse(saved);

    return {
      ...freshGame(),
      ...parsed,
      stats: {
        ...freshGame().stats,
        ...(parsed.stats || {})
      },
      goals: Array.isArray(parsed.goals) ? parsed.goals : [],
      daily: Array.isArray(parsed.daily) ? parsed.daily : [],
      bosses: Array.isArray(parsed.bosses) ? parsed.bosses : []
    };

  } catch (error) {

    console.warn("ASCEND save was reset:", error);

    localStorage.removeItem(SAVE_KEY);

    return freshGame();
  }
}

let G = loadGame();

function save() {

  try {

    localStorage.setItem(
      SAVE_KEY,
      JSON.stringify(G)
    );

  } catch (error) {

    console.warn(
      "ASCEND could not save:",
      error
    );

  }

}


/* =========================================================
   BASIC HELPERS
========================================================= */

function today() {

  return new Date()
    .toISOString()
    .slice(0,10);

}

function weekKey() {

  const d = new Date();

  const first = new Date(
    d.getFullYear(),
    0,
    1
  );

  const week = Math.ceil(
    (
      (
        (d - first) / 86400000
      ) +
      first.getDay() +
      1
    ) / 7
  );

  return d.getFullYear() + "-" + week;
}

function esc(value) {

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================================================
   LEVEL SYSTEM
========================================================= */

function xpNeed(level) {

  return Math.round(
    140 +
    Math.pow(level,1.55) * 55
  );

}

function rank(level) {

  if (level < 5) return "INITIATE";
  if (level < 10) return "APPRENTICE";
  if (level < 20) return "DEVELOPING";
  if (level < 30) return "ADVANCED";
  if (level < 50) return "ELITE";
  if (level < 75) return "MASTER";

  return "ASCENDANT";
}


/* =========================================================
   GOAL TYPE DETECTION
========================================================= */

function domains(text) {

  const t = text.toLowerCase();

  const result = [];

  if (
    /baseball|basketball|football|soccer|athlete|sport|runner|swim|fitness|pitcher|catcher|golf|tennis/.test(t)
  ) {
    result.push("performance");
  }

  if (
    /business|brand|company|entrepreneur|wealth|money|financial|freelance|startup|owner/.test(t)
  ) {
    result.push("business");
  }

  if (
    /chef|cook|cooking|baking|culinary|restaurant/.test(t)
  ) {
    result.push("craft");
  }

  if (
    /tattoo|drawing|painting|artist|photography|design|music|fashion/.test(t)
  ) {
    result.push("creative");
  }

  if (
    /language|japanese|spanish|french|german|korean|chinese|italian|learn/.test(t)
  ) {
    result.push("learning");
  }

  if (
    /pilot|aviation|airplane|flight|nurse|doctor|lawyer|teacher/.test(t)
  ) {
    result.push("professional");
  }

  if (
    /coding|program|developer|software|app|website|technology|engineering/.test(t)
  ) {
    result.push("technical");
  }

  if (!result.length) {
    result.push("general");
  }

  return [...new Set(result)];
}

    time:

    why:

    strengths:
      strengths || "",

    domains:
      domains(name),

    level: 1,

    xp: 0,

    completed: 0,

    used: [],

    boss: null

  };

  G.goals.push(goal);

  return goal;
}


/* =========================================================
   START PLAYER
========================================================= */

function startPlayer() {

  try {

    const nameInput =
      document.getElementById("name");

    const goalInput =
      document.getElementById("goal");

    if (!nameInput || !goalInput) {

      alert(
        "ASCEND could not find the player fields."
      );

      return;
    }

    const playerName =
      nameInput.value.trim();

    const firstGoal =
      goalInput.value.trim();

    if (!playerName) {

      alert(
        "Please enter your player name."
      );

      nameInput.focus();

      return;
    }

    if (!firstGoal) {

      alert(
        "Please enter your first major goal."
      );

      goalInput.focus();

      return;
    }

    G.player = playerName;

    createGoal(
      firstGoal,
      "Beginner",
      30,
      "",
      ""
    );

    G.day = "";
    G.week = "";
    G.daily = [];
    G.bosses = [];

    save();

    document.getElementById(
      "create"
    ).style.display = "none";

    render();

    toast(
      "PLAYER INITIALIZED // QUESTLINE CREATED"
    );

  } catch (error) {

    console.error(error);

    alert(
      "ASCEND encountered an error while creating your player. Please refresh the page and try again."
    );

  }

}

/* =========================================================
   MAKE DAILY MISSION
========================================================= */

function makeMission(goal) {

  let pool = [
    ...GENERAL_MISSIONS
  ];

  goal.domains.forEach(
    domain => {

      if (SPECIAL[domain]) {

        pool.push(
          ...SPECIAL[domain]
        );

      }

    }
  );

  let fresh =
    pool.filter(
      item =>
        !goal.used.includes(item[0])
    );

  if (fresh.length) {

    pool = fresh;

  }

  const item =
    pool[
      Math.floor(
        Math.random() *
        pool.length
      )
    ];

  goal.used.push(item[0]);

  if (goal.used.length > 50) {

    goal.used.shift();

  }

  let difficulty =
    goal.level >= 10
      ? "S"
      : goal.level >= 7
        ? "A"
        : goal.level >= 4
          ? "B"
          : goal.level >= 2
            ? "C"
            : "D";

  return {

    id:
      Date.now() +
      Math.random(),

    title:
      item[0],

    desc:
      item[1]
        .replaceAll(
          "{g}",
          goal.name
        )
        .replaceAll(
          "{t}",
          goal.time
        ),

    xp:
      item[2],

    stat:
      item[3],

    goalId:
      goal.id,

    done:
      false,

    diff:
      difficulty

  };

}


/* =========================================================
   GENERATE DAILY MISSIONS
========================================================= */

function generateDaily() {

  if (
    G.day === today() &&
    G.daily.length > 0
  ) {

    return;

  }

  G.day = today();

  G.daily = [];

  G.goals.forEach(
    goal => {

      G.daily.push(
        makeMission(goal)
      );

    }
  );

  /*
  Multiple-goal players get a bonus
  cross-training mission.
  */

  if (G.goals.length > 1) {

    G.daily.push({

      id:
        Date.now() +
        Math.random(),

      title:
        "THE MULTI-CLASS RAID",

      desc:
        "Complete one meaningful action that supports two different active goals today. You are building multiple versions of yourself at once.",

      xp:
        65,

      stat:
        "discipline",

      goalId:
        null,

      done:
        false,

      diff:
        "B"

    });

  }

}


/* =========================================================
   CREATE WEEKLY BOSS
========================================================= */

function createBoss(goal) {

  let type =
    goal.domains.find(
      d =>
        BOSS_TYPES[d]
    ) || "general";

  const template =
    BOSS_TYPES[type];

  const name =
    template.names[
      Math.floor(
        Math.random() *
        template.names.length
      )
    ];

  /*
  Difficulty increases as goal level increases.
  */

  const difficulty =
    Math.min(
      3,
      Math.floor(
        goal.level / 10
      )
    );

  const requirements =
    template.requirements.map(
      (text,index) => {

        let target;

        if (index === 0) {

          target =
            5 + difficulty;

        } else if (index === 1) {

          target =
            3 + difficulty;

        } else if (index === 2) {

          target =
            3 + difficulty;

        } else {

          target =
            1 + difficulty;

        }

        return {

          id: index,

          text,

          current: 0,

          target,

          done: false

        };

      }
    );

  return {

    id:
      Date.now() +
      Math.random(),

    goalId:
      goal.id,

    name,

    week:
      weekKey(),

    requirements,

    complete:
      false,

    claimed:
      false,

    rewardLevels:
      7,

    rewardXP:
      500 +
      goal.level * 80

  };

}


/* =========================================================
   GENERATE WEEKLY BOSSES
========================================================= */

function generateBosses() {

  const currentWeek =
    weekKey();

  if (
    G.week === currentWeek &&
    G.bosses.length === G.goals.length
  ) {

    return;

  }

  /*
  Save history from old bosses.
  */

  G.bosses.forEach(
    oldBoss => {

      if (oldBoss.claimed) {

        const goal =
          G.goals.find(
            g =>
              g.id === oldBoss.goalId
          );

        if (goal) {

          if (!Array.isArray(goal.bossHistory)) {

            goal.bossHistory = [];

          }

          goal.bossHistory.push(
            oldBoss.name
          );

        }

      }

    }
  );

  G.week =
    currentWeek;

  G.bosses = [];

  G.goals.forEach(
    goal => {

      const boss =
        createBoss(goal);

      goal.boss =
        boss;

      G.bosses.push(
        boss
      );

    }
  );

}


/* =========================================================
   UPDATE WEEKLY BOSS PROGRESS
========================================================= */

function updateBosses() {

  G.bosses.forEach(
    boss => {

      const goal =
        G.goals.find(
          g =>
            g.id === boss.goalId
        );

      if (!goal) return;

      const goalMissions =
        G.daily.filter(
          mission =>
            mission.goalId === goal.id
        );

      const completed =
        goalMissions.filter(
          mission =>
            mission.done
        );

      /*
      Requirement 1:
      daily missions
      */

      if (boss.requirements[0]) {

        boss.requirements[0].current =
          Math.min(
            boss.requirements[0].target,
            completed.length
          );

      }

      /*
      Requirement 2:
      skill practice
      */

      if (boss.requirements[1]) {

        const skill =
          completed.filter(
            mission =>
              mission.stat === "skill"
          ).length;

        boss.requirements[1].current =
          Math.min(
            boss.requirements[1].target,
            skill
          );

      }

      /*
      Requirement 3:
      meaningful work
      */

      if (boss.requirements[2]) {

        const meaningful =
          completed.filter(
            mission =>
              mission.stat === "career" ||
              mission.stat === "knowledge" ||
              mission.stat === "creativity"
          ).length;

        boss.requirements[2].current =
          Math.min(
            boss.requirements[2].target,
            meaningful
          );

      }

      /*
      Requirement 4:
      career action
      */

      if (boss.requirements[3]) {

        const career =
          completed.filter(
            mission =>
              mission.stat === "career"
          ).length;

        boss.requirements[3].current =
          Math.min(
            boss.requirements[3].target,
            career
          );

      }

      boss.requirements.forEach(
        requirement => {

          requirement.done =
            requirement.current >=
            requirement.target;

        }
      );

      boss.complete =
        boss.requirements.every(
          requirement =>
            requirement.done
        );

    }
  );

}


/* =========================================================
   COMPLETE DAILY MISSION
========================================================= */

function completeMission(id) {

  const mission =
    G.daily.find(
      item =>
        item.id == id
    );

  if (!mission) return;

  if (mission.done) return;

  mission.done = true;

  awardXP(
    mission.xp,
    mission.stat
  );

  if (mission.goalId) {

    const goal =
      G.goals.find(
        g =>
          g.id === mission.goalId
      );

    if (goal) {

      goal.completed++;

      goal.xp +=
        mission.xp;

      let required =
        100 +
        goal.level * 120;

      while (
        goal.xp >= required
      ) {

        goal.xp -= required;

        goal.level++;

        required =
          100 +
          goal.level * 120;

      }

    }

  }

  G.completed++;

  if (G.last !== today()) {

    if (G.last) {

      const difference =
        Math.floor(
          (
            new Date(today()) -
            new Date(G.last)
          ) /
          86400000
        );

      G.streak =
        difference === 1
          ? G.streak + 1
          : 1;

    } else {

      G.streak = 1;

    }

    G.last =
      today();

  }

  updateBosses();

  save();

  toast(
    "QUEST COMPLETE  +" +
    mission.xp +
    " XP"
  );

  render();

}


/* Keep compatibility with old button */
function complete(id,type) {

  if (type === "daily") {

    completeMission(id);

  }

}


/* =========================================================
   XP
========================================================= */

function awardXP(amount,stat) {

  G.xp += amount;

  if (
    Object.prototype.hasOwnProperty.call(
      G.stats,
      stat
    )
  ) {

    G.stats[stat]++;

  }

  let leveledUp = false;

  while (
    G.xp >= xpNeed(G.level)
  ) {

    G.xp -=
      xpNeed(G.level);

    G.level++;

    leveledUp = true;

  }

  if (leveledUp) {

    showLevelUp();

  }

}


/* =========================================================
   WEEKLY BOSS REWARDS
========================================================= */

function checkBossRewards() {

  let defeated = null;

  G.bosses.forEach(
    boss => {

      if (
        boss.complete &&
        !boss.claimed
      ) {

        boss.claimed = true;

        G.level += 7;

        G.xp +=
          boss.rewardXP;

        const goal =
          G.goals.find(
            g =>
              g.id === boss.goalId
          );

        if (goal) {

          goal.xp +=
            boss.rewardXP;

        }

        defeated =
          boss;

      }

    }
  );

  if (defeated) {

    showBossReward(
      defeated
    );

  }

}

/* =========================================================
   PAGE NAVIGATION
========================================================= */

function page(pageName) {

  document
    .querySelectorAll(".screen")
    .forEach(
      screen =>
        screen.classList.remove(
          "active"
        )
    );

  const target =
    document.getElementById(
      pageName
    );

  if (target) {

    target.classList.add(
      "active"
    );

  }

  document
    .querySelectorAll(".nav button")
    .forEach(
      button =>
        button.classList.remove(
          "active"
        )
    );

  const navButton =
    document.getElementById(
      "n-" + pageName
    );

  if (navButton) {

    navButton.classList.add(
      "active"
    );

  }

  render();

}


/* =========================================================
   TOAST
========================================================= */

function toast(message) {

  const element =
    document.getElementById(
      "toast"
    );

  if (!element) return;

  element.textContent =
    message;

  element.style.display =
    "block";

  setTimeout(
    () => {

      element.style.display =
        "none";

    },
    2800
  );

}


/* =========================================================
   CLOSE MODAL
========================================================= */

function closeModal() {

  const modal =
    document.getElementById(
      "modal"
    );

  if (modal) {

    modal.style.display =
      "none";

  }

}


/* =========================================================
   RENDER APP
========================================================= */

  if (!G.player) {

    const create =
      document.getElementById(
        "create"

    if (create) {

      create.style.display =
        "flex";

    }

    return;

  }

  const create =
    document.getElementById(
      "create"
    );

  if (create) {

    create.style.display =
      "none";

  }

  generateDaily();

  generateBosses();

  updateBosses();

  checkBossRewards();


  /* PLAYER */

  const player =
    document.getElementById(
      "player"
    );

  if (player) {

    player.textContent =
      "PLAYER // " +
      G.player;

  }


  const level =
    document.getElementById(
      "level"
    );

  if (level) {

    level.textContent =
      G.level;

  }


  const rankElement =
    document.getElementById(
      "rank"
    );

  if (rankElement) {

    rankElement.textContent =
      rank(G.level);

  }


  const requiredXP =
    xpNeed(G.level);


  const xpElement =
    document.getElementById(
      "xp"
    );

  if (xpElement) {

    xpElement.textContent =
      G.xp +
      " / " +
      requiredXP +
      " XP";

  }


  const xpFill =
    document.getElementById(
      "xpfill"
    );

  if (xpFill) {

    xpFill.style.width =
      Math.min(
        100,
        (
          G.xp /
          requiredXP
        ) * 100
      ) +
      "%";

  }


  const completedToday =
    G.daily.filter(
      mission =>
        mission.done
    ).length;


  const doneElement =
    document.getElementById(
      "done"
    );

  if (doneElement) {

    doneElement.textContent =
      completedToday;

  }


  const goalsElement =
    document.getElementById(
      "goals"
    );

  if (goalsElement) {

    goalsElement.textContent =
      G.goals.length;

  }


  const streakElement =
    document.getElementById(
      "streak"
    );

  if (streakElement) {

    streakElement.textContent =
      G.streak;

  }


  const todayElement =
    document.getElementById(
      "today"
    );

  if (todayElement) {

    todayElement.textContent =
      completedToday +
      " / " +
      G.daily.length +
      " DAILY QUESTS COMPLETE";

  }


  const missionStatus =
    document.getElementById(
      "missionstatus"
    );

  if (missionStatus) {

    missionStatus.textContent =
      completedToday +
      " / " +
      G.daily.length +
      " COMPLETE // DAILY OBJECTIVES ACTIVE";

  }


  /* HOME GOALS */

  const homeGoals =
    document.getElementById(
      "homegoals"
    );

  if (homeGoals) {

    homeGoals.innerHTML =
      G.goals.map(
        goal => {

              <div class="small">

                QUEST LEVEL
                ${goal.level}

                •
                ${goal.completed}
                MISSIONS COMPLETE

                class="bar"
                style="margin-top:8px"
              >

                    width:${percentage}%
                  "
                ></div>

              </div>

            </div>

          `;

        }
      ).join("");

  }


  /* HOME MISSIONS */

  const homeMissions =
    document.getElementById(
      "homemissions"
    );

  if (homeMissions) {

    homeMissions.innerHTML =
      G.daily
        .slice(0,3)
        .map(
          mission =>
            missionHTML(
              mission,
              G.goals.find(
                goal =>
                  goal.id ===
                  mission.goalId

        )
        .join("");

  }


  /* HOME BOSSES */

  const homeBosses =
    document.getElementById(
      "homebosses"
    );

  if (homeBosses) {

    homeBosses.innerHTML =
      G.bosses
        .map(
          boss =>
            bossHTML(boss)
        )
        .join("");

  }


  /* DAILY MISSIONS */

  const daily =
    document.getElementById(
      "daily"
    );

  if (daily) {

    daily.innerHTML =
      G.daily
        .map(
          mission =>
            missionHTML(
              mission,
              G.goals.find(
                goal =>
                  goal.id ===
                  mission.goalId
              )
            )
        )
        .join("");

  }


  /* WEEKLY BOSSES */

  const weekly =
    document.getElementById(
      "weekly"
    );

  if (weekly) {

    weekly.innerHTML =
      G.bosses
        .map(
          boss =>
            bossHTML(boss)
        )
        .join("");

  }


  /* QUEST LIST */

  const questList =
    document.getElementById(
      "questlist"
    );

  if (questList) {

    questList.innerHTML =
      G.goals
        .map(
          goal => `

            <div class="quest">

              <b>
                ⚔
                ${esc(goal.name)}
              </b>

              <div class="small">

                QUEST LEVEL
                ${goal.level}

                <br><br>

                EXPERIENCE:
                ${esc(goal.exp)}

                <br><br>

                DAILY TIME:
                ${goal.time}
                MINUTES

              </div>

              ${goal.domains.map(
                domain => `

                  <span class="tag">
                    ${domain.toUpperCase()}
                  </span>

                `
              ).join("")}

            </div>

          `
        )
        .join("");

  }


  /* STATS */

  const stats =
    document.getElementById(
      "stats"
    );

  if (stats) {

    stats.innerHTML =
      Object.entries(
        G.stats
      )
      .map(
        ([name,value]) => `

          <div class="skill">

            <div class="skillhead">

              <span>
                ${name.toUpperCase()}
              </span>

              ></div>

    document.getElementById(

    );

  if (progressGoals) {

    progressGoals.innerHTML =
      G.goals
        .map(
          goal => {

              G.bosses.find(
                b =>
                  b.goalId ===
                  goal.id
              );

            return `

              <div class="goal">

                <div class="goalname">

                  ${esc(goal.name)}

                </div>

                <div class="small">

                  LEVEL
                  ${goal.level}

                  <br>

                  ${goal.completed}

  }


  /* ACHIEVEMENTS */

  const achievements =
    document.getElementById(
      "ach"
    );

      ],

      ],

        G.streak >= 7
      ],

      [

        G.goals.length >= 2
      ],

        G.bosses.some(
          boss =>

        )
      ],

      [

        G.completed >= 100
      ]

    achievements.innerHTML =

        .map(
          achievement => `

            <div class="quest">

              <b>

                    ? "◆"
                    : "◇"
                }

              </b>

              <div class="small">

                ${achievement[1]}

              </div>

            </div>

        )
        .join("");

  }


  save();

}
