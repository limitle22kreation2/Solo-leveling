<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#020711;
    --panel:rgba(5,18,34,.82);
    --panel2:rgba(7,28,50,.72);
    --border:#168cff;
    --blue:#00aaff;
    --cyan:#57ddff;
    --text:#e9faff;
    --muted:#79a8c4;
    --glow:0 0 18px rgba(0,157,255,.55);
}

html{
    background:#020711;
}

body{
    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        radial-gradient(
            circle at 50% 20%,
            rgba(0,105,190,.20),
            transparent 45%
        ),
        linear-gradient(
            180deg,
            #020711 0%,
            #03101e 50%,
            #01050b 100%
        );

    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
}

/* DIGITAL GRID */

body::before{
    content:"";
    position:fixed;
    inset:0;

    background-image:
        linear-gradient(
            rgba(0,150,255,.055) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(0,150,255,.055) 1px,
            transparent 1px
        );

    background-size:35px 35px;

    pointer-events:none;
    z-index:-1;
}

/* BLUE SYSTEM SCAN */

body::after{
    content:"";
    position:fixed;
    left:0;
    right:0;
    height:2px;

    background:linear-gradient(
        90deg,
        transparent,
        #00aaff,
        transparent
    );

    opacity:.35;

    animation:scan 7s linear infinite;

    pointer-events:none;
    z-index:100;
}

@keyframes scan{
    0%{
        top:-5%;
    }

    100%{
        top:105%;
    }
}

/* BUTTONS */

button{
    border:1px solid var(--blue);

    border-radius:4px;

    padding:13px 20px;

    font-weight:800;

    cursor:pointer;

    background:
        linear-gradient(
            180deg,
            rgba(0,150,255,.22),
            rgba(0,50,100,.35)
        );

    color:var(--cyan);

    box-shadow:
        inset 0 0 15px rgba(0,140,255,.12),
        0 0 10px rgba(0,130,255,.2);

    text-transform:uppercase;

    letter-spacing:1px;

    transition:.2s;
}

button:hover{
    background:
        linear-gradient(
            180deg,
            rgba(0,180,255,.38),
            rgba(0,70,130,.45)
        );

    box-shadow:
        0 0 20px rgba(0,170,255,.55);

    transform:translateY(-1px);
}

button:disabled{
    opacity:.35;
    cursor:default;
    transform:none;
}

/* INPUTS */

input,
textarea,
select{

    width:100%;

    padding:14px;

    margin:7px 0;

    border-radius:3px;

    border:1px solid #1267a5;

    background:
        rgba(1,10,20,.85);

    color:var(--cyan);

    font-size:16px;

    outline:none;

    box-shadow:
        inset 0 0 12px rgba(0,100,180,.1);

}

input:focus,
textarea:focus,
select:focus{

    border-color:var(--cyan);

    box-shadow:
        0 0 15px rgba(0,180,255,.3),
        inset 0 0 12px rgba(0,100,180,.15);

}

/* SCREEN */

.screen{
    min-height:100vh;
    padding:30px 18px;
}

.center{
    display:flex;
    align-items:center;
    justify-content:center;
}

.hidden{
    display:none!important;
}

.container{
    width:min(100%,1050px);
    margin:auto;
    padding:18px;
}

/* ASCEND LOGO */

.logo{

    font-size:
        clamp(44px,12vw,82px);

    font-weight:900;

    letter-spacing:
        clamp(6px,2vw,14px);

    color:#e9fbff;

    text-shadow:
        0 0 5px #fff,
        0 0 15px #00aaff,
        0 0 35px #0077ff,
        0 0 70px #005eff;

    animation:
        logoPulse 3s ease-in-out infinite;

}

@keyframes logoPulse{

    0%,100%{
        text-shadow:
            0 0 5px #fff,
            0 0 15px #00aaff,
            0 0 35px #0077ff;
    }

    50%{
        text-shadow:
            0 0 8px #fff,
            0 0 25px #00cfff,
            0 0 55px #008cff,
            0 0 90px #005eff;
    }

}

.tagline{
    color:var(--cyan);
    font-size:18px;
    margin:18px 0 40px;
    letter-spacing:2px;
}

/* SYSTEM PANELS */

.panel{

    position:relative;

    background:
        linear-gradient(
            135deg,
            rgba(7,35,61,.82),
            rgba(2,13,25,.88)
        );

    border:1px solid rgba(0,157,255,.65);

    border-radius:4px;

    padding:22px;

    margin-bottom:18px;

    box-shadow:
        inset 0 0 25px rgba(0,120,255,.08),
        0 0 20px rgba(0,100,255,.12);

}

/* HOLOGRAPHIC CORNERS */

.panel::before,
.panel::after{

    content:"";

    position:absolute;

    width:18px;
    height:18px;

    border-color:var(--cyan);

    pointer-events:none;

}

.panel::before{

    top:-1px;
    left:-1px;

    border-top:2px solid;
    border-left:2px solid;

}

.panel::after{

    right:-1px;
    bottom:-1px;

    border-right:2px solid;
    border-bottom:2px solid;

}

/* HEADINGS */

h1,
h2,
h3{

    color:#e8faff;

    text-shadow:
        0 0 8px rgba(0,180,255,.5);

    letter-spacing:1px;

}

p{
    color:var(--muted);
    line-height:1.5;
}

.small{
    font-size:13px;
    color:#6395b3;
}

/* LEVEL */

.level-box{

    background:
        linear-gradient(
            135deg,
            rgba(4,32,57,.9),
            rgba(1,11,21,.95)
        );

    border:1px solid var(--blue);

    box-shadow:
        0 0 25px rgba(0,140,255,.18),
        inset 0 0 30px rgba(0,120,255,.08);

}

/* LEVEL NUMBER */

.level{

    color:var(--cyan);

    text-shadow:
        0 0 10px #00aaff,
        0 0 25px #0077ff;

}

/* XP */

.bar,
.xpbar{

    height:10px;

    background:
        rgba(0,25,45,.9);

    border:1px solid #075487;

    border-radius:2px;

    overflow:hidden;

}

.fill,
.xpfill{

    height:100%;

    background:
        linear-gradient(
            90deg,
            #0066ff,
            #00aaff,
            #8beaff
        );

    box-shadow:
        0 0 12px #00aaff,
        0 0 25px rgba(0,150,255,.7);

    transition:
        width .5s ease;

}

/* GOALS */

.goal-grid{

    display:grid;

    grid-template-columns:
        repeat(auto-fit,minmax(230px,1fr));

    gap:14px;

}

.goal{

    background:
        linear-gradient(
            135deg,
            rgba(5,31,54,.8),
            rgba(2,13,25,.85)
        );

    border:1px solid #126ca5;

    border-radius:3px;

    padding:17px;

    transition:.25s;

}

.goal:hover{

    border-color:var(--cyan);

    box-shadow:
        0 0 18px rgba(0,150,255,.25);

    transform:
        translateY(-2px);

}

/* QUESTS */

.quest{

    background:
        linear-gradient(
            135deg,
            rgba(5,34,60,.72),
            rgba(2,14,27,.88)
        );

    border:1px solid #0f649d;

    border-left:
        3px solid #00aaff;

    border-radius:2px;

    padding:18px;

    margin-top:12px;

    box-shadow:
        inset 0 0 20px rgba(0,130,255,.05);

}

.quest:hover{

    border-left-color:#7eeaff;

    box-shadow:
        0 0 18px rgba(0,150,255,.18);

}

.quest-title{

    color:#dff9ff;

    font-weight:800;

    font-size:17px;

    text-shadow:
        0 0 7px rgba(0,170,255,.45);

}

.reward{

    font-size:13px;

    color:#55cfff;

    margin:11px 0;

}

/* STATS */

.stat-grid{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:10px;

}

.stat{

    background:
        rgba(3,24,43,.78);

    border:1px solid #0e5e92;

    border-radius:3px;

    padding:14px;

    color:#8bdfff;

}

.stat-number{

    font-size:22px;

    font-weight:800;

    display:block;

    margin-top:5px;

    color:#e9fbff;

    text-shadow:
        0 0 8px #009dff;

}

/* NAVIGATION */

.nav{

    position:sticky;

    top:0;

    z-index:20;

    background:
        rgba(1,8,16,.92);

    backdrop-filter:
        blur(12px);

    border-bottom:
        1px solid #075487;

    box-shadow:
        0 0 20px rgba(0,120,255,.15);

}

.nav-inner{

    width:min(100%,1050px);

    margin:auto;

    padding:12px 18px;

    display:flex;

    gap:8px;

    overflow-x:auto;

}

.nav button{

    background:transparent;

    border-color:transparent;

    color:#5f91ae;

    box-shadow:none;

}

.nav button:hover{

    color:var(--cyan);

    background:
        rgba(0,130,255,.1);

}

.nav button.active{

    color:#e9fbff;

    border-color:#078de0;

    background:
        rgba(0,130,255,.18);

    box-shadow:
        0 0 12px rgba(0,150,255,.3);

}

/* ACHIEVEMENTS */

.achievement{

    display:flex;

    align-items:center;

    gap:12px;

    background:
        rgba(5,29,50,.75);

    border:
        1px solid #105f94;

    padding:14px;

    border-radius:3px;

    margin-top:10px;

}

.achievement-icon{

    font-size:28px;

    filter:
        drop-shadow(0 0 8px #009dff);

}

.achievement.locked{

    opacity:.35;

}

/* CHALLENGES */

.challenge{

    border-left:
        3px solid #00aaff;

    box-shadow:
        inset 0 0 25px rgba(0,140,255,.08);

}

/* MODAL */

.modal{

    position:fixed;

    inset:0;

    background:
        rgba(0,3,10,.82);

    backdrop-filter:
        blur(8px);

    display:flex;

    align-items:center;

    justify-content:center;

    padding:20px;

    z-index:90;

}

.modal-box{

    width:min(100%,500px);

    background:
        linear-gradient(
            135deg,
            #071f36,
            #020b14
        );

    border:
        1px solid #00aaff;

    box-shadow:
        0 0 35px rgba(0,150,255,.35);

    border-radius:3px;

    padding:22px;

}

/* TOAST */

.toast{

    position:fixed;

    bottom:25px;

    left:50%;

    transform:translateX(-50%);

    background:
        rgba(3,35,61,.96);

    color:#bff3ff;

    border:
        1px solid #00aaff;

    box-shadow:
        0 0 25px rgba(0,160,255,.55);

    padding:14px 22px;

    border-radius:3px;

    font-weight:800;

    letter-spacing:1px;

    z-index:100;

    display:none;

    animation:
        systemPop .25s ease;

}

@keyframes systemPop{

    from{
        opacity:0;
        transform:
            translateX(-50%)
            scale(.9);
    }

    to{
        opacity:1;
        transform:
            translateX(-50%)
            scale(1);
    }

}

/* MOBILE */

@media(max-width:700px){

    .stat-grid{
        grid-template-columns:
            repeat(2,1fr);
    }

    .container{
        padding:13px;
    }

    .panel{
        padding:18px;
    }

}
</style>
